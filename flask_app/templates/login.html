{% extends "base.html" %}
{% block titulo %}Cinepedia - Acceso{% endblock %}
{% block contenido %}
<div class="login-contenedor">
    <section>
        <h2>Registro</h2>
        <form method="post" action="{{ url_for('registrar') }}" class="login-form">
            <div class="campo"><label for="reg-nombre">Nombre</label><input id="reg-nombre" type="text" name="nombre" required minlength="2"></div>
            <div class="campo"><label for="reg-apellido">Apellido</label><input id="reg-apellido" type="text" name="apellido" required minlength="2"></div>
            <div class="campo"><label for="reg-email">Email</label><input id="reg-email" type="email" name="email" required></div>
            <div class="campo"><label for="reg-contrasena">Contraseña</label><input id="reg-contrasena" type="password" name="contrasena" required minlength="8"></div>
            <div class="campo"><label for="reg-confirmar">Confirmar contraseña</label><input id="reg-confirmar" type="password" name="confirmar_contrasena" required minlength="8"></div>
            <button type="submit">Registrarse</button>
        </form>
    </section>
    <section>
        <h2>Iniciar sesión</h2>
        <form method="post" action="{{ url_for('autenticar') }}" class="login-form">
            <div class="campo"><label for="login-email">Email</label><input id="login-email" type="email" name="email" required></div>
            <div class="campo"><label for="login-contrasena">Contraseña</label><input id="login-contrasena" type="password" name="contrasena" required></div>
            <button type="submit">Entrar</button>
        </form>
    </section>
</div>
{% endblock %}
